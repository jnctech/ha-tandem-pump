name: CI

on:
  push:
    branches: [master, develop, "release/*", "chore/release-*"]
  pull_request:
    branches: [master, develop]
  # Reusable: the Pre-release workflow runs the full suite on the exact release commit
  # (pushes made with GITHUB_TOKEN do not trigger this workflow on their own).
  workflow_call:
    inputs:
      ref:
        description: Commit SHA or ref to test (default - the triggering commit)
        type: string
        required: false
        default: ""

permissions: {}

jobs:
  lint:
    name: Python Code Format Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ruff (lint)
        run: ruff check custom_components/tandem tests scripts

      - name: Run ruff (format check)
        run: ruff format --check custom_components/tandem tests scripts

  typecheck:
    name: Static typing - mypy (strict)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run mypy (strict)
        run: mypy --strict custom_components/tandem

  test:
    name: Python Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        run: >
          pytest -v --tb=short
          --cov=custom_components/tandem
          --cov-report=xml:coverage.xml
          --cov-report=term-missing

  security:
    name: Security check - Bandit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run bandit
        run: bandit -c bandit.yaml -r custom_components/tandem

  hassfest:
    name: Check hassfest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ inputs.ref }}
      - uses: home-assistant/actions/hassfest@dce0e860c68256ef2902ece06afa5401eb4674e1  # master

  dependency-audit:
    name: Dependency vulnerability check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"

      - name: Run pip-audit
        run: |
          pip install pip-audit
          python -c "
          import json
          manifest = json.load(open('custom_components/tandem/manifest.json'))
          print('\n'.join(manifest.get('requirements', [])))
          " > /tmp/runtime-requirements.txt
          cat /tmp/runtime-requirements.txt
          pip-audit -r /tmp/runtime-requirements.txt

  lint-dockerfiles:
    name: Dockerfile lint (hadolint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ inputs.ref }}

      - name: Lint Dockerfile.test
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf  # v3.1.0
        with:
          dockerfile: Dockerfile.test
          ignore: DL3008  # apt version pinning impractical; we use --no-install-recommends

      - name: Lint .devcontainer/Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf  # v3.1.0
        with:
          dockerfile: .devcontainer/Dockerfile
          ignore: DL3008  # apt version pinning impractical; we use --no-install-recommends

  lint-actions:
    name: GitHub Actions lint (actionlint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ inputs.ref }}

      - name: Run actionlint
        run: |
          curl -sSfL --proto-redir -all,https \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            | tar -xz actionlint
          ./actionlint -color

  secrets:
    name: Secret scanning - Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: false
